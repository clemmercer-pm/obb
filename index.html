<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operation Bilingual Baby</title>
  <meta name="description" content="A jyutping-first Cantonese spaced-repetition app.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐸</text></svg>">
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <main class="app">
    <header class="masthead">
      <h1 class="logo">Operation Bilingual Baby</h1>
    </header>

    <!-- Review view -->
    <section id="view-review" class="view">
      <div class="subnav" id="reviewSubnav">
        <button type="button" class="subnav-btn is-active" data-mode="browse">Browse</button>
        <button type="button" class="subnav-btn" data-mode="practice">Practice</button>
      </div>

      <div id="browseMode" class="browse-mode">
        <div id="categoryList" class="category-list"></div>

        <div id="categoryDetail" class="category-detail" hidden>
          <button type="button" id="backToCategories" class="back-btn">&larr; All categories</button>
          <h2 id="categoryDetailTitle" class="passage-title"></h2>
          <div id="categoryCards" class="category-cards"></div>
        </div>
      </div>

      <div id="practiceMode" class="practice-mode" hidden>
        <p class="counter" id="counter"></p>

        <section id="app" class="card-area">
          <p class="category" id="category"></p>
          <p class="prompt" id="prompt"></p>

          <button type="button" id="showBtn" class="show-btn">Show answer</button>

          <div id="answer" class="answer" hidden></div>

          <button type="button" id="audioBtn" class="audio-btn" hidden title="Play audio">🔊 Play</button>

          <div id="ratingBar" class="rating-bar" hidden>
            <button type="button" data-quality="1" class="rate rate-again">Again</button>
            <button type="button" data-quality="3" class="rate rate-hard">Hard</button>
            <button type="button" data-quality="4" class="rate rate-good">Good</button>
            <button type="button" data-quality="5" class="rate rate-easy">Easy</button>
          </div>
        </section>

        <p id="empty" class="empty" hidden></p>
      </div>
    </section>

    <!-- Translate & Learn view -->
    <section id="view-translate" class="view" hidden>
      <p class="translate-hint">Type an English word or sentence.</p>
      <div class="translate-bar">
        <input type="text" id="translateInput" class="translate-input" placeholder="e.g. have you done your piano?">
        <button type="button" id="translateBtn" class="show-btn translate-btn">Translate</button>
      </div>
      <div id="translateStatus" class="translate-status"></div>
      <div id="translateResult" class="passage-lines"></div>
    </section>

    <!-- Storytime view -->
    <section id="view-storytime" class="view" hidden>
      <div id="storytimeList" class="storytime-list"></div>

      <div id="storytimePassage" class="storytime-passage" hidden>
        <button type="button" id="backToList" class="back-btn">&larr; All storytime</button>
        <h2 id="passageTitle" class="passage-title"></h2>
        <button type="button" id="playPassage" class="show-btn">🔊 Play whole thing</button>
        <div id="passageLines" class="passage-lines"></div>
      </div>
    </section>
  </main>

  <!-- Bottom tab bar -->
  <nav class="tabs tabs-bottom" id="tabs">
    <button type="button" class="tab is-active" data-view="review"><span class="tab-icon">📇</span>Review</button>
    <button type="button" class="tab" data-view="translate"><span class="tab-icon">🔤</span>Translate</button>
    <button type="button" class="tab" data-view="storytime"><span class="tab-icon">📖</span>Storytime</button>
  </nav>

  <!-- Shared word popover, used by Storytime and Translate & Learn -->
  <div id="wordPopover" class="word-popover" hidden>
    <button type="button" id="closePopover" class="popover-close" aria-label="Close">&times;</button>
    <div class="popover-jyutping" id="popoverJyutping"></div>
    <div class="popover-characters" id="popoverCharacters"></div>
    <div class="popover-english" id="popoverEnglish"></div>
    <button type="button" id="addToDeckBtn" class="add-btn">+ Add to my deck</button>
  </div>

  <script src="data.js?v=1"></script>
  <script src="storytime-data.js?v=1"></script>
  <script src="cc-canto.js?v=1"></script>
  <script src="word-popover.js?v=1"></script>
  <script src="storytime.js?v=2"></script>
  <script src="translate.js?v=1"></script>
  <script src="browse.js?v=1"></script>
  <script src="nav.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
